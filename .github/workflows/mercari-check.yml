name: Mercari Alert Check

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

# 같은 알림 봇은 한 번에 하나만 실행합니다. 수동 실행이 겹쳐도 상태 저장 순서가 보장됩니다.
concurrency:
  group: mercari-check
  cancel-in-progress: false

permissions:
  contents: write
  actions: read   # 실패 알림에서 직전 실행의 성공 여부를 확인하는 데 씁니다

jobs:
  check:
    runs-on: ubuntu-latest
    # 한 실행은 보통 50~90초입니다. 상한이 없으면 GitHub 기본값인 6시간까지 붙잡고 있는데,
    # concurrency 그룹이 실행을 하나로 묶어 두기 때문에 그동안 봇 전체가 멈춥니다
    # (git push가 네트워크에서 멈추는 경우처럼 스스로 시간 제한이 없는 단계가 있습니다).
    # 10분이면 정상 실행에는 여유가 충분하고, 멈춘 실행은 실패로 끝나 텔레그램 알림이 갑니다.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # 의존성 캐시를 켜면 매 실행마다 반복되는 설치 시간(대략 15~25초)이 줄어듭니다.
      # 1분 주기처럼 짧게 돌릴수록 이 고정 비용이 알림 지연에서 차지하는 비중이 큽니다.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Send 단계 내부(check_mercari.py)에서도 알림 하나마다 바로 push를 하기 때문에,
      # git 사용자 정보를 맨 앞에서 한 번만 설정해 모든 이후 단계에서 쓸 수 있게 합니다.
      - name: Configure git identity
        run: |
          git config user.name "mercari-alert-bot"
          git config user.email "actions@github.com"

      # 회귀를 미리 잡아내기 위해 배포 전에 유닛 테스트를 돌립니다 (표준 라이브러리만 사용, 추가 의존성 없음).
      - name: Run unit tests
        run: python -m unittest discover -s tests

      # 1) 메루카리 검색 후, 새 알림과 최신 가격을 상태 파일에 먼저 기록합니다.
      - name: Collect Mercari updates
        run: python check_mercari.py --mode collect

      # 2) 텔레그램을 호출하기 전에 상태를 GitHub에 확정합니다.
      - name: Persist collected state before notification
        run: bash scripts/push_state.sh "queue Mercari alerts"

      # 3) 원격 저장소에 저장된 대기열만 전송합니다.
      #    알림을 하나 보낼 때마다 스크립트 내부에서 곧바로 push_state.sh를 호출해
      #    '전송 성공했지만 기록은 아직 안 올라간' 위험 구간을 최소화합니다.
      - name: Send pending Telegram alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_mercari.py --mode send

      # 4) 최종 안전망: 건별 push로 못 잡은 자투리 상태 변화(재시도 횟수, 포기한 항목 등)를
      #    한 번 더 반영합니다. 전송 단계가 중간에 실패해도 가능한 한 상태는 보존합니다.
      - name: Persist delivery result
        if: always()
        run: bash scripts/push_state.sh "record Mercari alert delivery"

      # 5) 이 봇은 평소에 조용한 게 정상이라, 고장이 나도 "새 매물이 없나 보다"와 구분되지 않습니다.
      #    실행이 실패하면 그 사실을 텔레그램으로 알립니다.
      #    1분마다 도는 봇이라 실패할 때마다 알리면 폭탄이 되므로,
      #    '직전 실행은 성공했는데 이번에 실패한' 전환 시점에만 보냅니다(스크립트 주석 참고).
      - name: Notify on failure
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: mercari-check.yml
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: bash scripts/notify_failure.sh
