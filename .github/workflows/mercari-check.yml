name: Mercari Alert Check

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

# 같은 알림 봇은 한 번에 하나만 실행합니다. 수동 실행이 겹쳐도 상태 저장 순서가 보장됩니다.
concurrency:
  group: mercari-check
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 회귀를 미리 잡아내기 위해 배포 전에 유닛 테스트를 돌립니다 (표준 라이브러리만 사용, 추가 의존성 없음).
      - name: Run unit tests
        run: python -m unittest discover -s tests

      # 1) 메루카리 검색 후, 새 알림과 최신 가격을 상태 파일에 먼저 기록합니다.
      - name: Collect Mercari updates
        run: python check_mercari.py --mode collect

      # 2) 텔레그램을 호출하기 전에 상태를 GitHub에 확정합니다.
      - name: Persist collected state before notification
        run: |
          git config user.name "mercari-alert-bot"
          git config user.email "actions@github.com"
          bash scripts/push_state.sh "queue Mercari alerts"

      # 3) 이제 원격 저장소에 저장된 대기열만 전송합니다.
      - name: Send pending Telegram alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_mercari.py --mode send

      # 4) 성공적으로 전송한 알림을 전송 이력에 기록하고 대기열에서 제거합니다.
      #    전송 단계가 중간에 실패해도 가능한 한 상태는 보존합니다.
      - name: Persist delivery result
        if: always()
        run: |
          git config user.name "mercari-alert-bot"
          git config user.email "actions@github.com"
          bash scripts/push_state.sh "record Mercari alert delivery"
