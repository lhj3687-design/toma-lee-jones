name: Bot Watchdog

# 봇 실행이 러너를 못 받고 멈추면 밖에서 끊어 줍니다.
#
# 2026-09-12 19:21 UTC에 실행 하나가 `queued` 상태로 7시간 18분 멈췄고, concurrency
# 그룹을 쥔 채였기 때문에 뒤따른 478개 실행이 대기 슬롯에서 밀려나며 전부 취소됐습니다.
# 알림이 7시간 넘게 끊겼습니다. 자세한 경위는 scripts/watchdog.py 문서 문자열에 있습니다.
#
# 왜 별도 워크플로인가: 봇 워크플로 안에서는 고칠 수 없습니다. 어떤 스텝을 맨 앞에
# 두든 그 스텝도 잡이 시작돼야 도는데, 잡이 시작되지 못하는 것 자체가 고장이기
# 때문입니다. timeout-minutes도 잡이 **시작된 뒤부터** 세기 때문에 걸리지 않습니다.
on:
  # 10분마다. GitHub 스케줄은 혼잡할 때 밀리므로 감지까지 걸리는 시간은 이보다
  # 길어질 수 있습니다. 그래도 상한이 7시간에서 30분 안팎으로 내려옵니다.
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true면 판단만 하고 아무것도 취소하지 않습니다"
        required: false
        default: "false"

# 봇과 **다른 그룹**입니다. 같은 그룹에 넣으면 봇이 막혔을 때 이 워크플로도 같이
# 막혀서 존재 의미가 사라집니다. 자기 자신은 겹치면 새 것만 남깁니다.
concurrency:
  group: bot-watchdog
  cancel-in-progress: true

permissions:
  contents: read
  actions: write   # 멈춘 실행을 취소하는 데 필요합니다 (read로는 안 됩니다)
  issues: write    # 실행 자체가 안 생기는 경우를 이슈로 알립니다

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # 이 감시 도구가 잘못 판단하면 멀쩡한 대기 실행을 죽여서 봇을 멈추게 합니다.
      # 고장을 못 잡는 것보다 나쁩니다. 그래서 판정 로직 테스트를 먼저 돌리고,
      # 깨졌으면 아무것도 취소하지 않고 실패로 끝냅니다(추가 의존성 없이 1초).
      - name: Run watchdog tests
        run: python3 -m unittest tests.test_watchdog

      - name: Unstick the bot
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          WORKFLOW_FILE: mercari-check.yml
        run: |
          python3 scripts/watchdog.py \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
